<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Mini Life Sim</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #111827;
      --panel-2: #1f2937;
      --text: #f9fafb;
      --muted: #9ca3af;
      --good: #22c55e;
      --warn: #f59e0b;
      --bad: #ef4444;
      --accent: #3b82f6;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, sans-serif;
    }

    header {
      padding: 12px 16px;
      background: #020617;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      border-bottom: 1px solid #334155;
    }

    .title {
      font-size: 20px;
      font-weight: bold;
      margin-right: 8px;
    }

    .stat {
      background: var(--panel-2);
      padding: 8px 10px;
      border-radius: 10px;
      min-width: 80px;
      text-align: center;
    }

    .stat.small {
      min-width: 56px;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin-left: auto;
    }

    button {
      background: var(--panel-2);
      color: var(--text);
      border: 1px solid #475569;
      border-radius: 10px;
      padding: 8px 10px;
      cursor: pointer;
    }

    button:hover {
      filter: brightness(1.15);
    }

    button.active {
      background: var(--accent);
      border-color: var(--accent);
    }

    label {
      display: flex;
      gap: 6px;
      align-items: center;
      background: var(--panel-2);
      padding: 8px 10px;
      border-radius: 10px;
      cursor: pointer;
    }

    main {
      display: flex;
      gap: 12px;
      padding: 12px;
      align-items: flex-start;
    }

    aside {
      background: var(--panel);
      border: 1px solid #334155;
      border-radius: 14px;
      padding: 12px;
    }

    #needs {
      width: 240px;
      display: grid;
      gap: 10px;
    }

    #side {
      width: 300px;
      display: grid;
      gap: 12px;
    }

    #canvas-wrap {
      flex: 1;
      display: grid;
      place-items: center;
      background: var(--panel);
      border: 1px solid #334155;
      border-radius: 14px;
      padding: 12px;
      overflow: auto;
    }

    canvas {
      background: white;
      border-radius: 12px;
      max-width: 100%;
      height: auto;
    }

    h2 {
      margin: 0 0 10px;
      font-size: 16px;
    }

    .need {
      display: grid;
      gap: 4px;
    }

    .need-label {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: var(--muted);
    }

    .bar {
      height: 14px;
      background: #334155;
      border-radius: 999px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      width: 50%;
      transition: width 0.15s linear;
    }

    .bar-fill.good {
      background: var(--good);
    }

    .bar-fill.warn {
      background: var(--warn);
    }

    .bar-fill.bad {
      background: var(--bad);
    }

    #objectName {
      font-size: 18px;
      margin-bottom: 10px;
    }

    #objectActions {
      display: grid;
      gap: 8px;
    }

    .action {
      display: grid;
      gap: 2px;
      text-align: left;
      padding: 10px;
    }

    .action small {
      color: var(--muted);
    }

    .current {
      background: var(--panel-2);
      border-radius: 10px;
      padding: 10px;
      margin-bottom: 8px;
      line-height: 1.4;
    }

    .notification {
      font-size: 13px;
      padding: 6px 0;
      border-bottom: 1px solid #334155;
      color: #e5e7eb;
    }

    .hint {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.4;
    }

    @media (max-width: 1200px) {
      main {
        flex-wrap: wrap;
      }

      #needs,
      #side {
        width: 100%;
      }
    }
  
    /* iPhone/touch playability */
    button, label, canvas { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
    body { min-height: 100dvh; padding-bottom: env(safe-area-inset-bottom); }
    @media (max-width: 700px) {
      header { padding: calc(8px + env(safe-area-inset-top)) 8px 8px; gap: 6px; position: relative; }
      .title { width: 100%; font-size: 18px; }
      .stat, .stat.small { min-width: 0; flex: 1; padding: 7px 6px; font-size: 13px; }
      .controls { width: 100%; margin-left: 0; flex-wrap: nowrap; overflow-x: auto; padding-bottom: 3px; }
      .controls button, .controls label { flex: 0 0 auto; min-height: 42px; }
      main { display: grid; grid-template-columns: 1fr; padding: 6px; gap: 8px; }
      #canvas-wrap { order: -3; width: 100%; padding: 3px; overflow: hidden; border-radius: 10px; }
      canvas { width: 100%; height: auto; border-radius: 8px; }
      #needs { order: -2; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 7px; }
      #needs h2 { grid-column: 1 / -1; margin: 0; }
      #side { order: -1; }
      #needs, #side { width: 100%; padding: 10px; }
      #objectActions { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .notification { font-size: 12px; }
    }
  </style>
  <style id="premium-skin">
    :root {
      --bg: #07111e;
      --panel: #0f1b2b;
      --panel-2: #17283d;
      --text: #f8f4e9;
      --muted: #9aabbd;
      --line: rgba(170, 193, 214, 0.18);
      --accent: #f4b83f;
      --accent-2: #74d2bd;
      --shadow: 0 18px 42px rgba(0, 0, 0, 0.28);
    }

    html {
      min-width: 320px;
      background: var(--bg);
    }

    body {
      min-height: 100dvh;
      color: var(--text);
      font-family: ui-rounded, "Avenir Next", "Trebuchet MS", system-ui, sans-serif;
      background:
        radial-gradient(circle at 16% 0%, rgba(64, 111, 142, 0.26), transparent 34rem),
        radial-gradient(circle at 92% 18%, rgba(208, 143, 56, 0.11), transparent 28rem),
        linear-gradient(140deg, #07111e 0%, #0a1728 56%, #08111d 100%);
      letter-spacing: 0.01em;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.22;
      background-image: radial-gradient(rgba(255,255,255,0.22) 0.6px, transparent 0.6px);
      background-size: 5px 5px;
      mix-blend-mode: soft-light;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 5;
      padding: 14px clamp(12px, 2vw, 28px);
      gap: 10px;
      background: rgba(7, 17, 30, 0.88);
      border-bottom: 1px solid var(--line);
      box-shadow: 0 8px 26px rgba(0, 0, 0, 0.2);
      backdrop-filter: blur(18px);
    }

    .title {
      display: flex;
      align-items: center;
      gap: 11px;
      min-width: 206px;
      margin-right: 8px;
      font-size: 21px;
      letter-spacing: -0.03em;
    }

    .brand-mark {
      display: grid;
      place-items: center;
      width: 36px;
      height: 36px;
      color: #1c2833;
      font-size: 22px;
      background: linear-gradient(145deg, #ffd36a, #e89f2f);
      border: 1px solid rgba(255,255,255,0.48);
      border-radius: 12px 12px 10px 10px;
      box-shadow: 0 5px 14px rgba(238, 169, 54, 0.24);
    }

    .brand-copy {
      display: grid;
      gap: 2px;
      line-height: 1;
    }

    .brand-copy b {
      color: var(--accent);
      font-weight: 800;
    }

    .brand-copy small {
      color: var(--muted);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .stat {
      position: relative;
      min-width: 90px;
      padding: 17px 14px 8px;
      color: var(--text);
      text-align: left;
      background: linear-gradient(145deg, rgba(24, 43, 64, 0.96), rgba(15, 28, 45, 0.96));
      border: 1px solid var(--line);
      border-radius: 13px;
      box-shadow: inset 0 1px rgba(255,255,255,0.05), 0 4px 12px rgba(0,0,0,0.16);
      font-size: 15px;
      font-weight: 800;
    }

    .stat::before {
      content: attr(data-label);
      position: absolute;
      top: 6px;
      left: 14px;
      color: #8094a9;
      font-size: 8px;
      font-weight: 800;
      letter-spacing: 0.15em;
    }

    #clock {
      min-width: 126px;
      color: #ffe7ad;
    }

    #money {
      color: #b7e8b1;
    }

    #mood {
      min-width: 72px;
      font-size: 21px;
      text-align: center;
    }

    .controls {
      gap: 6px;
    }

    button,
    label {
      border: 1px solid rgba(171, 198, 219, 0.2);
      border-radius: 10px;
      background: linear-gradient(145deg, #1b3047, #13243a);
      box-shadow: inset 0 1px rgba(255,255,255,0.05), 0 4px 10px rgba(0,0,0,0.12);
      transition: transform 140ms ease, border-color 140ms ease, background 140ms ease, box-shadow 140ms ease;
    }

    button {
      min-height: 36px;
      padding: 8px 11px;
      color: var(--text);
      font: inherit;
      font-size: 12px;
      font-weight: 800;
    }

    button:hover,
    button:focus-visible,
    label:hover {
      filter: none;
      transform: translateY(-1px);
      border-color: rgba(244, 184, 63, 0.7);
      box-shadow: 0 7px 16px rgba(0,0,0,0.18), 0 0 0 3px rgba(244,184,63,0.08);
      outline: none;
    }

    button:active {
      transform: translateY(1px) scale(0.98);
    }

    button.active,
    #pauseBtn {
      color: #1e2935;
      background: linear-gradient(145deg, #ffd36b, #e9a632);
      border-color: #ffd979;
      box-shadow: 0 5px 14px rgba(235, 169, 48, 0.2);
    }

    #pauseBtn {
      min-width: 76px;
    }

    label {
      min-height: 36px;
      padding: 8px 10px;
      color: #c9d6e3;
      font-size: 11px;
      font-weight: 800;
    }

    label input {
      accent-color: var(--accent-2);
    }

    main {
      display: grid;
      grid-template-columns: minmax(184px, 216px) minmax(500px, 1fr) minmax(224px, 270px);
      gap: 14px;
      max-width: 1700px;
      margin: 0 auto;
      padding: 18px clamp(10px, 2vw, 28px) 28px;
      align-items: start;
    }

    aside,
    #canvas-wrap {
      background: linear-gradient(160deg, rgba(18, 33, 51, 0.96), rgba(10, 24, 39, 0.96));
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: var(--shadow), inset 0 1px rgba(255,255,255,0.04);
    }

    aside {
      padding: 14px;
    }

    #needs,
    #side {
      width: auto;
    }

    #needs {
      display: grid;
      gap: 10px;
      align-content: start;
    }

    #side {
      display: grid;
      gap: 14px;
    }

    #canvas-wrap {
      min-width: 0;
      padding: 9px;
      background: linear-gradient(145deg, rgba(17, 31, 46, 0.98), rgba(8, 20, 33, 0.98));
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100%;
      max-width: 100%;
      height: auto;
      background: #0b1420;
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 13px;
      box-shadow: 0 10px 28px rgba(0,0,0,0.3);
    }

    h2 {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 12px;
      color: #f4ead5;
      font-size: 14px;
      letter-spacing: 0.02em;
    }

    h2 > span:last-child {
      display: grid;
      gap: 2px;
    }

    h2 small {
      color: #7890a5;
      font-size: 8px;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .panel-icon {
      display: grid;
      place-items: center;
      width: 25px;
      height: 25px;
      color: #1b2731;
      font-size: 13px;
      background: linear-gradient(145deg, #ffd16b, #e8a130);
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(232,161,48,0.2);
    }

    .need {
      gap: 6px;
      padding: 9px 9px 10px;
      background: rgba(28, 49, 70, 0.52);
      border: 1px solid rgba(159, 188, 211, 0.1);
      border-radius: 12px;
    }

    .need-label {
      align-items: center;
      color: #c8d5e2;
      font-size: 11px;
      font-weight: 800;
    }

    .need-name {
      display: inline-flex;
      align-items: center;
      gap: 7px;
    }

    .need-icon {
      display: grid;
      place-items: center;
      width: 19px;
      height: 19px;
      color: #16212d;
      font-size: 11px;
      background: #f2b544;
      border-radius: 7px;
    }

    .need-value {
      color: #f5dfad;
      font-size: 11px;
    }

    .bar {
      height: 8px;
      background: #0a1524;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 999px;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.28);
    }

    .bar-fill {
      border-radius: inherit;
      box-shadow: 0 0 10px rgba(255,255,255,0.16);
    }

    .bar-fill.good {
      background: linear-gradient(90deg, #66bfa4, #9be180);
    }

    .bar-fill.warn {
      background: linear-gradient(90deg, #e4a13a, #ffd16b);
    }

    .bar-fill.bad {
      background: linear-gradient(90deg, #d95d64, #ff8c6b);
    }

    .need-tip {
      margin-top: 5px;
      padding: 11px;
      color: #a9bdc7;
      font-size: 11px;
      line-height: 1.45;
      background: rgba(116, 210, 189, 0.08);
      border: 1px solid rgba(116, 210, 189, 0.18);
      border-radius: 12px;
    }

    .need-tip strong {
      color: #aee7d8;
    }

    #objectName {
      margin-bottom: 11px;
      color: #ffe4a7;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    #objectActions {
      gap: 8px;
    }

    .action {
      min-height: 52px;
      gap: 4px;
      padding: 10px 11px;
      text-align: left;
      background: linear-gradient(145deg, rgba(31, 57, 77, 0.94), rgba(19, 38, 58, 0.94));
    }

    .action-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      color: #f5f0e5;
      font-size: 12px;
      font-weight: 800;
    }

    .action-arrow {
      color: var(--accent);
      font-size: 15px;
    }

    .action small {
      color: #91a7b9;
      font-size: 10px;
      font-weight: 700;
    }

    .current {
      margin-bottom: 8px;
      padding: 11px;
      color: #c5d5e1;
      line-height: 1.4;
      background: linear-gradient(145deg, rgba(32, 59, 75, 0.94), rgba(17, 35, 53, 0.94));
      border: 1px solid rgba(116, 210, 189, 0.22);
      border-radius: 12px;
    }

    .current-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #ffdda0;
      font-size: 12px;
      font-weight: 800;
    }

    .state-dot {
      width: 8px;
      height: 8px;
      background: var(--accent-2);
      border-radius: 50%;
      box-shadow: 0 0 0 4px rgba(116,210,189,0.12), 0 0 12px rgba(116,210,189,0.8);
    }

    .current-meta {
      margin-top: 5px;
      color: #9eb3c1;
      font-size: 10px;
    }

    .current-progress {
      height: 6px;
      margin-top: 9px;
      overflow: hidden;
      background: #0b1726;
      border-radius: 999px;
    }

    .current-progress span {
      display: block;
      height: 100%;
      background: linear-gradient(90deg, #74d2bd, #f4b83f);
      border-radius: inherit;
    }

    .notification {
      padding: 8px 0;
      color: #a8b9c8;
      font-size: 10px;
      line-height: 1.35;
      border-bottom: 1px solid rgba(170,193,214,0.12);
    }

    .notification:first-child {
      color: #f4d38a;
    }

    .hint {
      padding: 11px;
      color: #92a9bb;
      font-size: 11px;
      line-height: 1.55;
      background: rgba(9, 22, 36, 0.55);
      border: 1px dashed rgba(159, 188, 211, 0.17);
      border-radius: 11px;
    }

    @media (max-width: 1200px) {
      main {
        grid-template-columns: minmax(175px, 210px) minmax(420px, 1fr);
      }

      #side {
        grid-column: 1 / -1;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      }
    }

    @media (max-width: 700px) {
      header {
        position: relative;
        padding: calc(9px + env(safe-area-inset-top)) 8px 9px;
      }

      .title {
        width: 100%;
        min-width: 0;
      }

      .stat,
      .stat.small {
        flex: 1;
        min-width: 0;
        padding-right: 9px;
        padding-left: 9px;
      }

      .stat::before {
        left: 9px;
      }

      .controls {
        width: 100%;
        margin-left: 0;
        padding-bottom: 3px;
        overflow-x: auto;
        flex-wrap: nowrap;
      }

      .controls button,
      .controls label {
        flex: 0 0 auto;
        min-height: 42px;
      }

      main {
        display: grid;
        grid-template-columns: 1fr;
        gap: 9px;
        padding: 8px 6px 18px;
      }

      #canvas-wrap {
        order: -3;
        width: 100%;
        padding: 4px;
      }

      #needs {
        order: -2;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 7px;
      }

      #needs h2,
      .need-tip {
        grid-column: 1 / -1;
      }

      #side {
        order: -1;
        grid-column: auto;
        grid-template-columns: 1fr;
      }

      aside {
        padding: 11px;
        border-radius: 15px;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="title">
      <span class="brand-mark">⌂</span>
      <span class="brand-copy"><span>Mini <b>Life</b> Sim</span><small>make today count</small></span>
    </div>
    <div class="stat" id="clock" data-label="TIME">Day 1 08:00</div>
    <div class="stat small" id="money" data-label="CASH">$120</div>
    <div class="stat small" id="mood" data-label="MOOD">🙂</div>

    <div class="controls">
      <button id="pauseBtn">Pause</button>
      <button class="speed" data-speed="1">1x</button>
      <button class="speed active" data-speed="5">5x</button>
      <button class="speed" data-speed="15">15x</button>
      <button class="speed" data-speed="60">60x</button>
      <label>
        <input type="checkbox" id="autonomy" checked />
        Autonomy
      </label>
      <button id="saveBtn">Save</button>
      <button id="loadBtn">Load</button>
      <button id="resetBtn">Reset</button>
    </div>
  </header>

  <main>
    <aside id="needs"></aside>

    <div id="canvas-wrap">
      <canvas id="game" width="960" height="600"></canvas>
    </div>

    <aside id="side">
      <div>
        <h2><span class="panel-icon">✦</span><span>Selected<small>interaction</small></span></h2>
        <div id="objectName">None</div>
        <div id="objectActions"></div>
      </div>

      <div>
        <h2><span class="panel-icon">☷</span><span>Log<small>recent moments</small></span></h2>
        <div id="notificationList"></div>
      </div>
    </aside>
  </main>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");

    const NEEDS = [
      { id: "hunger", label: "Hunger", icon: "🍽" },
      { id: "bladder", label: "Bladder", icon: "◔" },
      { id: "energy", label: "Energy", icon: "ϟ" },
      { id: "hygiene", label: "Hygiene", icon: "✦" },
      { id: "fun", label: "Fun", icon: "☀" },
      { id: "social", label: "Social", icon: "◉" }
    ];

    const OBJECTS = [
      { id: "fridge", name: "Fridge", emoji: "🧊", x: 45, y: 70, w: 64, h: 64 },
      { id: "stove", name: "Stove", emoji: "🍳", x: 135, y: 70, w: 64, h: 64 },
      { id: "sink", name: "Sink", emoji: "🚰", x: 225, y: 70, w: 64, h: 64 },
      { id: "trash", name: "Trash", emoji: "🗑️", x: 315, y: 150, w: 50, h: 50 },
      { id: "toilet", name: "Toilet", emoji: "🚽", x: 665, y: 70, w: 64, h: 64 },
      { id: "shower", name: "Shower", emoji: "🚿", x: 775, y: 70, w: 64, h: 64 },
      { id: "bathSink", name: "Sink", emoji: "🧼", x: 880, y: 70, w: 64, h: 64 },
      { id: "bed", name: "Bed", emoji: "🛏️", x: 45, y: 430, w: 130, h: 80 },
      { id: "tv", name: "TV", emoji: "📺", x: 665, y: 430, w: 80, h: 50 },
      { id: "sofa", name: "Sofa", emoji: "🛋️", x: 780, y: 480, w: 100, h: 50 },
      { id: "computer", name: "Computer", emoji: "💻", x: 875, y: 390, w: 64, h: 64 },
      { id: "phone", name: "Phone", emoji: "📱", x: 470, y: 290, w: 48, h: 48 }
    ];

    const ACTIONS = {
      snack: {
        label: "Grab Snack",
        objectIds: ["fridge"],
        duration: 10,
        cost: 3,
        effects: { hunger: 25, hygiene: -1, fun: 1 },
        notify: "Ate a snack."
      },
      cook: {
        label: "Cook Meal",
        objectIds: ["stove"],
        duration: 35,
        cost: 8,
        effects: { hunger: 65, fun: 4, energy: -4, hygiene: -2 },
        notify: "Cooked and ate a meal."
      },
      wash: {
        label: "Wash Hands",
        objectIds: ["sink", "bathSink"],
        duration: 4,
        effects: { hygiene: 6, fun: 1 },
        notify: "Washed hands."
      },
      toilet: {
        label: "Use Toilet",
        objectIds: ["toilet"],
        duration: 10,
        effects: { bladder: 95, hygiene: -1 },
        notify: "Used the toilet."
      },
      shower: {
        label: "Take Shower",
        objectIds: ["shower"],
        duration: 25,
        effects: { hygiene: 85, energy: 3, fun: 2 },
        notify: "Took a shower."
      },
      nap: {
        label: "Nap",
        objectIds: ["bed"],
        duration: 60,
        effects: { energy: 35, hunger: -4, bladder: -4 },
        notify: "Took a nap."
      },
      sleep: {
        label: "Sleep",
        objectIds: ["bed"],
        duration: 360,
        effects: { energy: 95, hunger: -8, bladder: -8, hygiene: -2 },
        notify: "Slept and recovered energy."
      },
      watch: {
        label: "Watch TV",
        objectIds: ["tv"],
        duration: 35,
        effects: { fun: 50, energy: -2, social: 4 },
        notify: "Watched TV."
      },
      sit: {
        label: "Relax on Sofa",
        objectIds: ["sofa"],
        duration: 20,
        effects: { energy: 12, fun: 10, social: 2 },
        notify: "Relaxed on the sofa."
      },
      work: {
        label: "Work",
        objectIds: ["computer"],
        duration: 120,
        money: 140,
        effects: { energy: -18, fun: -12, hygiene: -6, social: -4 },
        notify: "Finished work and earned money."
      },
      browse: {
        label: "Browse Internet",
        objectIds: ["computer"],
        duration: 20,
        effects: { fun: 22, social: 6, energy: -2 },
        notify: "Browsed the internet."
      },
      call: {
        label: "Call Friend",
        objectIds: ["phone"],
        duration: 25,
        effects: { social: 65, fun: 12, energy: -3 },
        notify: "Called a friend."
      },
      clean: {
        label: "Clean Up",
        objectIds: ["trash"],
        duration: 25,
        effects: { hygiene: 10, fun: -4, energy: -6 },
        notify: "Cleaned up the house."
      }
    };

    const DECAY = {
      hunger: -0.045,
      bladder: -0.055,
      energy: -0.035,
      hygiene: -0.035,
      fun: -0.040,
      social: -0.025
    };

    function createInitialState() {
      return {
        time: 8 * 60,
        day: 1,
        speed: 5,
        paused: false,
        autonomy: true,
        money: 120,
        needs: {
          hunger: 80,
          bladder: 80,
          energy: 80,
          hygiene: 80,
          fun: 80,
          social: 80
        },
        char: {
          x: 480,
          y: 300
        },
        moveTarget: null,
        currentAction: null,
        selectedObject: null,
        notifications: [],
        warnings: {},
        autonomyCooldown: 0
      };
    }

    let state = createInitialState();

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function formatClock() {
      const h = Math.floor(state.time / 60) % 24;
      const m = Math.floor(state.time % 60);
      return `Day ${state.day} ${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")}`;
    }

    function notify(msg) {
      state.notifications.unshift({ time: formatClock(), msg });
      state.notifications = state.notifications.slice(0, 10);
      renderNotifications();
    }

    function renderNotifications() {
      const el = document.getElementById("notificationList");
      el.innerHTML = "";

      state.notifications.forEach((n) => {
        const div = document.createElement("div");
        div.className = "notification";
        div.textContent = `[${n.time}] ${n.msg}`;
        el.appendChild(div);
      });
    }

    function buildNeedsUI() {
      const needsPanel = document.getElementById("needs");
      needsPanel.innerHTML = `
        <h2><span class="panel-icon">♥</span><span>Needs<small>wellbeing</small></span></h2>
      `;

      NEEDS.forEach((need) => {
        const div = document.createElement("div");
        div.className = "need";
        div.innerHTML = `
          <div class="need-label">
            <span class="need-name"><span class="need-icon">${need.icon}</span>${need.label}</span>
            <span class="need-value" id="value-${need.id}">0</span>
          </div>
          <div class="bar">
            <div id="bar-${need.id}" class="bar-fill good"></div>
          </div>
        `;
        needsPanel.appendChild(div);
      });

      needsPanel.insertAdjacentHTML(
        "beforeend",
        `<div class="need-tip"><strong>Little reminder</strong><br />A balanced day keeps your Sim happy, healthy, and ready for whatever comes next.</div>`
      );
    }

    function moodEmoji() {
      const avg =
        NEEDS.reduce((sum, need) => sum + state.needs[need.id], 0) /
        NEEDS.length;

      if (avg > 75) return "😄";
      if (avg > 55) return "🙂";
      if (avg > 35) return "😐";
      if (avg > 20) return "😟";
      return "😭";
    }

    function updateHUD() {
      document.getElementById("clock").textContent = formatClock();
      document.getElementById("money").textContent = `$${Math.round(state.money)}`;
      document.getElementById("mood").textContent = moodEmoji();
      document.getElementById("pauseBtn").textContent = state.paused ? "Resume" : "Pause";
      document.getElementById("autonomy").checked = state.autonomy;

      const progressFill = document.querySelector(".current-progress span");
      if (progressFill && state.currentAction) {
        const progress = state.currentAction.phase === "doing"
          ? clamp(state.currentAction.elapsed / state.currentAction.duration, 0, 1)
          : 0;
        progressFill.style.width = `${progress * 100}%`;
      }

      NEEDS.forEach((need) => {
        const value = Math.round(state.needs[need.id]);
        const bar = document.getElementById(`bar-${need.id}`);
        const label = document.getElementById(`value-${need.id}`);

        if (bar) {
          bar.style.width = `${value}%`;
          bar.className = `bar-fill ${value > 60 ? "good" : value > 30 ? "warn" : "bad"}`;
        }

        if (label) {
          label.textContent = value;
        }
      });

      document.querySelectorAll(".speed").forEach((btn) => {
        btn.classList.toggle(
          "active",
          Number(btn.dataset.speed) === state.speed && !state.paused
        );
      });
    }

    function renderPanel() {
      const objectName = document.getElementById("objectName");
      const objectActions = document.getElementById("objectActions");

      objectActions.innerHTML = "";

      if (state.currentAction) {
        const action = state.currentAction;

        objectName.textContent = action.label;

        const current = document.createElement("div");
        current.className = "current";
        const progress = action.phase === "doing"
          ? clamp(action.elapsed / action.duration, 0, 1)
          : 0;
        current.innerHTML = `
          <div class="current-title"><span>${action.label}</span><span class="state-dot"></span></div>
          <div class="current-meta">${action.phase === "move" ? `Walking to ${action.targetName}` : `${Math.floor(action.elapsed)} / ${action.duration} min`}</div>
          ${action.phase === "doing" ? `<div class="current-progress"><span style="width: ${progress * 100}%"></span></div>` : ""}
        `;

        const cancel = document.createElement("button");
        cancel.textContent = "Cancel Action";
        cancel.onclick = () => {
          state.currentAction = null;
          state.moveTarget = null;
          notify("Action cancelled.");
          renderPanel();
        };

        objectActions.appendChild(current);
        objectActions.appendChild(cancel);
        return;
      }

      const obj = OBJECTS.find((o) => o.id === state.selectedObject);

      if (!obj) {
        objectName.textContent = "None";
        objectActions.innerHTML = `
          <div class="hint">
            Click an object to choose an interaction.<br /><br />
            Click the floor to move.<br /><br />
            Keep needs healthy, earn money, and survive the day.
          </div>
        `;
        return;
      }

      objectName.textContent = `${obj.emoji} ${obj.name}`;

      const actions = Object.entries(ACTIONS).filter(([, action]) =>
        action.objectIds.includes(obj.id)
      );

      if (!actions.length) {
        objectActions.innerHTML = `<div class="hint">No interactions available.</div>`;
        return;
      }

      actions.forEach(([id, action]) => {
        const btn = document.createElement("button");
        btn.className = "action";

        const costText = action.cost ? `-$${action.cost}` : "";
        const moneyText = action.money ? `+$${action.money}` : "";
        const moneyParts = [costText, moneyText].filter(Boolean).join(" ");

        btn.innerHTML = `
          <span class="action-label"><span>${action.label}</span><span class="action-arrow">→</span></span>
          <small>${action.duration} min ${moneyParts}</small>
        `;

        btn.onclick = () => startAction(id);
        objectActions.appendChild(btn);
      });
    }

    function applyEffects(effects) {
      if (!effects) return;

      for (const [key, value] of Object.entries(effects)) {
        if (state.needs[key] !== undefined) {
          state.needs[key] = clamp(state.needs[key] + value, 0, 100);
        }
      }
    }

    function startAction(id) {
      const action = ACTIONS[id];
      if (!action) return;

      if (action.cost && state.money < action.cost) {
        notify(`Not enough money for ${action.label}.`);
        return;
      }

      const targetId =
        state.selectedObject && action.objectIds.includes(state.selectedObject)
          ? state.selectedObject
          : action.objectIds[0];

      const obj = OBJECTS.find((o) => o.id === targetId);
      if (!obj) return;

      state.selectedObject = obj.id;
      state.moveTarget = null;

      state.currentAction = {
        id,
        label: action.label,
        duration: action.duration,
        cost: action.cost || 0,
        money: action.money || 0,
        effects: action.effects || {},
        notify: action.notify || `${action.label} finished.`,
        phase: "move",
        elapsed: 0,
        targetX: obj.x + obj.w / 2,
        targetY: obj.y + obj.h / 2,
        targetName: obj.name
      };

      renderPanel();
    }

    function completeAction() {
      const action = state.currentAction;
      if (!action) return;

      if (action.cost) {
        state.money -= action.cost;
      }

      if (action.money) {
        state.money += action.money;
      }

      applyEffects(action.effects);
      notify(action.notify);

      state.currentAction = null;
      state.autonomyCooldown = 3;

      renderPanel();
    }

    function moveTowards(target, dt) {
      const dx = target.x - state.char.x;
      const dy = target.y - state.char.y;
      const dist = Math.hypot(dx, dy);

      const step = 170 * dt * Math.max(1, Math.min(state.speed, 10));

      if (dist <= step || dist < 2) {
        state.char.x = target.x;
        state.char.y = target.y;
        return true;
      }

      state.char.x += (dx / dist) * step;
      state.char.y += (dy / dist) * step;
      return false;
    }

    function decayNeeds(gameMinutes) {
      for (const [key, rate] of Object.entries(DECAY)) {
        state.needs[key] = clamp(state.needs[key] + rate * gameMinutes, 0, 100);
      }
    }

    function checkWarnings() {
      NEEDS.forEach((need) => {
        const value = state.needs[need.id];

        if (value < 20 && !state.warnings[need.id]) {
          notify(`${need.label} is critically low!`);
          state.warnings[need.id] = true;
        } else if (value > 30 && state.warnings[need.id]) {
          state.warnings[need.id] = false;
        }
      });
    }

    function chooseAutonomous() {
      const n = state.needs;
      const candidates = [];

      if (n.bladder < 70) {
        candidates.push({
          id: "toilet",
          score: 110 - n.bladder + (n.bladder < 30 ? 30 : 0)
        });
      }

      if (n.hunger < 70) {
        const wantsCook = n.hunger < 35 && state.money >= (ACTIONS.cook.cost || 0);

        candidates.push({
          id: wantsCook ? "cook" : "snack",
          score: 105 - n.hunger + (n.hunger < 30 ? 25 : 0)
        });
      }

      if (n.energy < 65) {
        candidates.push({
          id: n.energy < 25 ? "sleep" : "nap",
          score: 100 - n.energy + (n.energy < 20 ? 25 : 0)
        });
      }

      if (n.hygiene < 65) {
        candidates.push({
          id: "shower",
          score: 95 - n.hygiene
        });
      }

      if (n.fun < 60) {
        candidates.push({
          id: "watch",
          score: 90 - n.fun
        });
      }

      if (n.social < 60) {
        candidates.push({
          id: "call",
          score: 90 - n.social
        });
      }

      if (state.money < 80 && n.energy > 35 && n.bladder > 35 && n.hunger > 35) {
        candidates.push({
          id: "work",
          score: 80
        });
      }

      if (!candidates.length) {
        candidates.push(
          { id: "sit", score: 10 },
          { id: "browse", score: 8 },
          { id: "clean", score: 6 }
        );
      }

      let affordable = candidates.filter((candidate) => {
        const action = ACTIONS[candidate.id];
        return !action.cost || state.money >= action.cost;
      });

      if (!affordable.length) {
        affordable = [
          { id: "sit", score: 10 },
          { id: "browse", score: 8 },
          { id: "clean", score: 6 },
          { id: "work", score: 5 }
        ];
      }

      const chosen = affordable.sort((a, b) => b.score - a.score)[0];

      if (chosen) {
        startAction(chosen.id);
      }
    }

    function update(dt) {
      const gameMinutes = dt * state.speed;

      state.time += gameMinutes;

      if (state.time >= 1440) {
        state.time -= 1440;
        state.day += 1;
        notify("A new day begins.");
      }

      decayNeeds(gameMinutes);

      if (state.currentAction) {
        const action = state.currentAction;

        if (action.phase === "move") {
          const arrived = moveTowards(
            { x: action.targetX, y: action.targetY },
            dt
          );

          if (arrived) {
            action.phase = "doing";
          }
        } else {
          action.elapsed += gameMinutes;

          if (action.elapsed >= action.duration) {
            completeAction();
          }
        }
      } else if (state.moveTarget) {
        const arrived = moveTowards(state.moveTarget, dt);

        if (arrived) {
          state.moveTarget = null;
        }
      }

      if (state.autonomy && !state.currentAction && !state.moveTarget) {
        state.autonomyCooldown -= gameMinutes;

        if (state.autonomyCooldown <= 0) {
          chooseAutonomous();
          state.autonomyCooldown = 5;
        }
      }

      checkWarnings();
      updateHUD();
    }

    function roundedPath(x, y, w, h, radius) {
      const r = Math.min(radius, Math.abs(w) / 2, Math.abs(h) / 2);
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    function fillRounded(x, y, w, h, radius, color) {
      roundedPath(x, y, w, h, radius);
      ctx.fillStyle = color;
      ctx.fill();
    }

    function strokeRounded(x, y, w, h, radius, color, width = 1) {
      roundedPath(x, y, w, h, radius);
      ctx.strokeStyle = color;
      ctx.lineWidth = width;
      ctx.stroke();
    }

    function drawFloorPattern(x, y, w, h, type) {
      ctx.save();
      ctx.beginPath();
      ctx.rect(x, y, w, h);
      ctx.clip();
      ctx.lineWidth = 1;
      ctx.strokeStyle = type === "tile" ? "rgba(255,244,215,0.17)" : "rgba(76,42,27,0.13)";

      if (type === "tile") {
        for (let gx = x - 12; gx < x + w + 24; gx += 32) {
          ctx.beginPath();
          ctx.moveTo(gx, y);
          ctx.lineTo(gx, y + h);
          ctx.stroke();
        }
        for (let gy = y - 12; gy < y + h + 24; gy += 32) {
          ctx.beginPath();
          ctx.moveTo(x, gy);
          ctx.lineTo(x + w, gy);
          ctx.stroke();
        }
      } else {
        for (let gy = y + 12; gy < y + h + 20; gy += 14) {
          ctx.beginPath();
          ctx.moveTo(x, gy);
          ctx.lineTo(x + w, gy);
          ctx.stroke();
        }
        ctx.strokeStyle = "rgba(255,240,207,0.1)";
        for (let gx = x + 18; gx < x + w + 20; gx += 72) {
          ctx.beginPath();
          ctx.moveTo(gx, y);
          ctx.lineTo(gx, y + h);
          ctx.stroke();
        }
      }
      ctx.restore();
    }

    function drawRoom(room) {
      ctx.save();
      ctx.shadowColor = "rgba(27, 15, 16, 0.4)";
      ctx.shadowBlur = 10;
      ctx.shadowOffsetY = 4;
      fillRounded(room.x, room.y, room.w, room.h, 10, room.color);
      ctx.restore();

      drawFloorPattern(room.x + 2, room.y + 2, room.w - 4, room.h - 4, room.type);
      strokeRounded(room.x, room.y, room.w, room.h, 10, "rgba(55, 32, 28, 0.8)", 4);
      strokeRounded(room.x + 5, room.y + 5, room.w - 10, room.h - 10, 7, "rgba(255,239,203,0.22)", 1);

      ctx.font = "800 11px ui-rounded, Trebuchet MS, sans-serif";
      const labelWidth = ctx.measureText(room.name).width + 20;
      fillRounded(room.x + 12, room.y + 12, labelWidth, 23, 11, "rgba(33, 28, 29, 0.56)");
      ctx.fillStyle = "#fff0cc";
      ctx.textAlign = "left";
      ctx.textBaseline = "middle";
      ctx.fillText(room.name, room.x + 22, room.y + 23.5);
    }

    function drawWindow(x, y, w, h) {
      fillRounded(x, y, w, h, 6, "#263b4e");
      fillRounded(x + 5, y + 5, w - 10, h - 10, 3, "#83a9b8");
      ctx.strokeStyle = "rgba(236, 242, 224, 0.58)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(x + w / 2, y + 5);
      ctx.lineTo(x + w / 2, y + h - 5);
      ctx.moveTo(x + 5, y + h / 2);
      ctx.lineTo(x + w - 5, y + h / 2);
      ctx.stroke();
      ctx.fillStyle = "rgba(255, 234, 155, 0.65)";
      ctx.beginPath();
      ctx.arc(x + w - 17, y + 14, 4, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawPlant(x, y, scale = 1) {
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(scale, scale);
      fillRounded(-13, 5, 26, 19, 5, "#a96448");
      fillRounded(-10, 3, 20, 6, 3, "#d98d59");
      ctx.fillStyle = "#4d8566";
      [[-8, 2, -20, -15], [0, 0, -2, -23], [7, 2, 19, -15], [-4, -1, -12, -26], [5, -3, 12, -27]].forEach(([sx, sy, ex, ey]) => {
        ctx.beginPath();
        ctx.moveTo(sx, sy);
        ctx.quadraticCurveTo((sx + ex) / 2, ey - 4, ex, ey);
        ctx.quadraticCurveTo((sx + ex) / 2 + 4, ey + 2, sx, sy);
        ctx.fill();
      });
      ctx.restore();
    }

    function drawRooms() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const backdrop = ctx.createLinearGradient(0, 0, 0, canvas.height);
      backdrop.addColorStop(0, "#101b29");
      backdrop.addColorStop(1, "#07111d");
      ctx.fillStyle = backdrop;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.save();
      ctx.shadowColor = "rgba(0,0,0,0.58)";
      ctx.shadowBlur = 18;
      ctx.shadowOffsetY = 7;
      fillRounded(14, 14, 932, 572, 23, "#3b2a2d");
      ctx.restore();

      fillRounded(20, 20, 920, 560, 18, "#c69e73");
      drawFloorPattern(23, 23, 914, 554, "wood");

      const rooms = [
        { name: "Kitchen", x: 30, y: 30, w: 290, h: 220, color: "#cba976", type: "tile" },
        { name: "Entry", x: 330, y: 30, w: 290, h: 220, color: "#b78963", type: "wood" },
        { name: "Bathroom", x: 640, y: 30, w: 290, h: 220, color: "#71969a", type: "tile" },
        { name: "Bedroom", x: 30, y: 360, w: 290, h: 210, color: "#9b7c72", type: "wood" },
        { name: "Living Room", x: 330, y: 270, w: 600, h: 300, color: "#c29a6c", type: "wood" }
      ];
      rooms.forEach(drawRoom);

      fillRounded(390, 362, 232, 116, 18, "rgba(229, 190, 121, 0.28)");
      strokeRounded(390, 362, 232, 116, 18, "rgba(89, 52, 37, 0.24)", 2);
      drawWindow(405, 46, 104, 36);
      drawPlant(570, 103, 0.72);
      drawPlant(585, 526, 1.05);
      drawPlant(350, 525, 0.58);

      fillRounded(525, 286, 63, 10, 5, "rgba(65, 39, 31, 0.36)");
      ctx.fillStyle = "#5a3529";
      ctx.fillRect(530, 290, 5, 17);
      ctx.fillRect(578, 290, 5, 17);
      fillRounded(526, 280, 60, 11, 4, "#9a6644");
    }

    function drawObjectShadow(obj) {
      ctx.save();
      ctx.fillStyle = "rgba(47, 25, 23, 0.28)";
      ctx.beginPath();
      ctx.ellipse(obj.x + obj.w / 2 + 2, obj.y + obj.h + 4, Math.max(18, obj.w * 0.42), Math.max(4, obj.h * 0.08), 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function drawObjectSprite(obj) {
      const x = obj.x;
      const y = obj.y;
      const w = obj.w;
      const h = obj.h;
      drawObjectShadow(obj);
      ctx.save();
      ctx.lineJoin = "round";
      ctx.lineCap = "round";

      switch (obj.id) {
        case "fridge":
          fillRounded(x + 4, y + 2, w - 8, h - 3, 8, "#657c72");
          fillRounded(x + 8, y + 7, w - 16, 23, 5, "#7f9786");
          ctx.strokeStyle = "rgba(35,45,45,0.44)";
          ctx.lineWidth = 2;
          ctx.beginPath(); ctx.moveTo(x + 7, y + 34); ctx.lineTo(x + w - 7, y + 34); ctx.stroke();
          ctx.fillStyle = "#d5b879"; ctx.fillRect(x + w - 16, y + 13, 3, 10); ctx.fillRect(x + w - 16, y + 44, 3, 11);
          fillRounded(x + 14, y + 18, 9, 5, 2, "#d68e65");
          break;
        case "stove":
          fillRounded(x + 2, y + 4, w - 4, h - 4, 8, "#3a4850");
          fillRounded(x + 10, y + 34, w - 20, 23, 4, "#202b32");
          ctx.strokeStyle = "#bf9b6d"; ctx.lineWidth = 2; ctx.strokeRect(x + 18, y + 39, w - 36, 12);
          [[20, 17], [43, 17], [20, 29], [43, 29]].forEach(([bx, by]) => {
            ctx.fillStyle = "#222e34"; ctx.beginPath(); ctx.arc(x + bx, y + by, 8, 0, Math.PI * 2); ctx.fill();
            ctx.strokeStyle = "rgba(220,188,130,0.72)"; ctx.lineWidth = 1; ctx.stroke();
          });
          ctx.fillStyle = "#e6bd65"; [14, 26, 38, 50].forEach((kx) => { ctx.beginPath(); ctx.arc(x + kx, y + 7, 2, 0, Math.PI * 2); ctx.fill(); });
          break;
        case "sink":
          fillRounded(x + 1, y + 8, w - 2, h - 9, 7, "#ad8057");
          fillRounded(x + 10, y + 17, w - 20, 25, 7, "#d5d6c4");
          fillRounded(x + 17, y + 22, w - 34, 13, 5, "#79a3a4");
          ctx.strokeStyle = "#e0d7b8"; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(x + w - 17, y + 16, 8, Math.PI, Math.PI * 1.65); ctx.stroke();
          break;
        case "trash":
          fillRounded(x + 7, y + 9, w - 14, h - 9, 5, "#65706f");
          fillRounded(x + 3, y + 4, w - 6, 7, 4, "#404d52");
          ctx.strokeStyle = "#aeb5a7"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x + 18, y + 18); ctx.lineTo(x + 18, y + h - 7); ctx.moveTo(x + 28, y + 18); ctx.lineTo(x + 28, y + h - 7); ctx.stroke();
          break;
        case "toilet":
          fillRounded(x + 15, y + 4, w - 30, 23, 5, "#e0ddd0");
          fillRounded(x + 8, y + 22, w - 16, h - 22, 13, "#f0eee2");
          fillRounded(x + 18, y + 28, w - 36, 15, 8, "#9bb9b8");
          break;
        case "shower":
          fillRounded(x + 4, y + 4, w - 8, h - 5, 8, "rgba(170, 215, 216, 0.38)");
          strokeRounded(x + 4, y + 4, w - 8, h - 5, 8, "#e1eee1", 2);
          ctx.strokeStyle = "rgba(225,238,225,0.82)"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x + 18, y + 6); ctx.lineTo(x + 18, y + h - 7); ctx.moveTo(x + w - 18, y + 6); ctx.lineTo(x + w - 18, y + h - 7); ctx.stroke();
          ctx.fillStyle = "#dce8d0"; ctx.beginPath(); ctx.arc(x + w / 2, y + 18, 5, 0, Math.PI * 2); ctx.fill();
          break;
        case "bathSink":
          fillRounded(x + 3, y + 17, w - 6, h - 17, 6, "#8d6b51");
          fillRounded(x + 10, y + 6, w - 20, 25, 8, "#e3e0d3");
          ctx.fillStyle = "#86a9a5"; ctx.beginPath(); ctx.ellipse(x + w / 2, y + 18, 14, 6, 0, 0, Math.PI * 2); ctx.fill();
          ctx.strokeStyle = "#eee5c7"; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(x + w / 2 + 16, y + 8, 7, Math.PI, Math.PI * 1.6); ctx.stroke();
          break;
        case "bed":
          fillRounded(x + 2, y + 9, w - 4, h - 7, 8, "#563c33");
          fillRounded(x + 8, y + 6, w - 16, h - 17, 9, "#dfd6bb");
          fillRounded(x + 8, y + 32, w - 16, h - 43, 7, "#7c855d");
          fillRounded(x + 14, y + 12, 38, 20, 7, "#f4eddb");
          fillRounded(x + 59, y + 12, 38, 20, 7, "#f4eddb");
          ctx.strokeStyle = "#ad774d"; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(x + 8, y + h - 4); ctx.lineTo(x + w - 8, y + h - 4); ctx.stroke();
          break;
        case "tv":
          fillRounded(x + 2, y + 3, w - 4, h - 8, 7, "#3c3941");
          fillRounded(x + 9, y + 9, w - 18, h - 19, 4, "#263b4a");
          ctx.fillStyle = "rgba(129,205,194,0.42)"; ctx.fillRect(x + 13, y + 13, w - 30, 4);
          ctx.fillStyle = "#c2a064"; ctx.fillRect(x + w / 2 - 2, y + h - 4, 4, 8);
          break;
        case "sofa":
          fillRounded(x + 2, y + 14, w - 4, h - 12, 12, "#687254");
          fillRounded(x + 8, y + 4, w - 16, 32, 11, "#78835f");
          fillRounded(x + 12, y + 19, 32, 25, 8, "#78835f");
          fillRounded(x + 53, y + 19, 32, 25, 8, "#78835f");
          ctx.strokeStyle = "rgba(37,48,37,0.35)"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x + 50, y + 20); ctx.lineTo(x + 50, y + 43); ctx.stroke();
          break;
        case "computer":
          fillRounded(x + 3, y + 38, w - 6, 14, 4, "#78533c");
          fillRounded(x + 12, y + 5, w - 24, 35, 5, "#303c48");
          fillRounded(x + 18, y + 10, w - 36, 23, 3, "#76a2a0");
          ctx.fillStyle = "#e6c46e"; ctx.fillRect(x + 27, y + 16, 12, 2); ctx.fillRect(x + 27, y + 22, 19, 2);
          ctx.fillStyle = "#d8c69d"; ctx.fillRect(x + 20, y + 43, w - 30, 4);
          break;
        case "phone":
          fillRounded(x + 8, y + 2, w - 16, h - 4, 8, "#2a3949");
          fillRounded(x + 12, y + 7, w - 24, h - 15, 5, "#6eaaa4");
          ctx.fillStyle = "#f1d17a"; ctx.beginPath(); ctx.arc(x + w / 2, y + 14, 3, 0, Math.PI * 2); ctx.fill();
          break;
      }
      ctx.restore();

      const selected = state.selectedObject === obj.id;
      if (selected) {
        const pulse = 0.72 + Math.sin(performance.now() / 220) * 0.12;
        ctx.save();
        ctx.shadowColor = "rgba(244,184,63,0.78)";
        ctx.shadowBlur = 14;
        ctx.globalAlpha = pulse;
        ctx.setLineDash([5, 4]);
        strokeRounded(x - 5, y - 5, w + 10, h + 10, 11, "#f4c55d", 2);
        ctx.restore();
      }

      ctx.font = "700 10px ui-rounded, Trebuchet MS, sans-serif";
      const labelWidth = ctx.measureText(obj.name).width + 15;
      fillRounded(x + w / 2 - labelWidth / 2, y + h + 7, labelWidth, 17, 8, selected ? "#3a2b20" : "rgba(19, 27, 33, 0.68)");
      ctx.fillStyle = selected ? "#ffe29b" : "#f4e5c4";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(obj.name, x + w / 2, y + h + 15.5);
    }

    function drawObjects() {
      OBJECTS.forEach(drawObjectSprite);
    }

    function drawCharacter() {
      const t = performance.now() / 180;
      const bob = state.currentAction || state.moveTarget ? Math.sin(t) * 2 : Math.sin(t * 0.45) * 0.8;
      const x = state.char.x;
      const y = state.char.y + bob;
      let status = "Taking it easy";

      if (state.currentAction) {
        const action = state.currentAction;
        status = action.phase === "move" ? `Walking to ${action.targetName}` : action.label;
      } else if (state.moveTarget) {
        status = "Moving";
      }

      if (state.moveTarget) {
        const pulse = 10 + (Math.sin(performance.now() / 160) + 1) * 4;
        ctx.save();
        ctx.globalAlpha = 0.68;
        ctx.strokeStyle = "#f4c55d";
        ctx.lineWidth = 2;
        ctx.setLineDash([4, 4]);
        ctx.beginPath();
        ctx.arc(state.moveTarget.x, state.moveTarget.y, pulse, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      }

      ctx.save();
      ctx.fillStyle = "rgba(40, 25, 26, 0.35)";
      ctx.beginPath();
      ctx.ellipse(x, y + 21, 17, 6, 0, 0, Math.PI * 2);
      ctx.fill();

      fillRounded(x - 11, y + 7, 8, 18, 4, "#34485b");
      fillRounded(x + 3, y + 7, 8, 18, 4, "#34485b");
      fillRounded(x - 16, y - 10, 32, 29, 11, "#4b7c70");
      fillRounded(x - 12, y - 16, 24, 21, 10, "#c88961");
      fillRounded(x - 13, y - 20, 26, 10, 8, "#633f2e");
      ctx.fillStyle = "#f2d2a3";
      ctx.beginPath(); ctx.arc(x - 5, y - 8, 1.6, 0, Math.PI * 2); ctx.arc(x + 5, y - 8, 1.6, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = "#8a4f46"; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(x, y - 5, 4, 0.15, Math.PI - 0.15); ctx.stroke();
      ctx.restore();

      ctx.font = "700 11px ui-rounded, Trebuchet MS, sans-serif";
      const statusWidth = Math.min(185, Math.max(92, ctx.measureText(status).width + 50));
      const bubbleX = clamp(x - statusWidth / 2, 22, canvas.width - statusWidth - 22);
      const bubbleY = Math.max(31, y - 61);
      fillRounded(bubbleX, bubbleY, statusWidth, 28, 12, "rgba(12, 25, 37, 0.92)");
      strokeRounded(bubbleX, bubbleY, statusWidth, 28, 12, "rgba(244,195,93,0.42)", 1);
      ctx.fillStyle = "#f7e6bd";
      ctx.textAlign = "left";
      ctx.textBaseline = "middle";
      ctx.fillText(status, bubbleX + 11, bubbleY + 14);
      ctx.font = "18px serif";
      ctx.textAlign = "right";
      ctx.fillText(moodEmoji(), bubbleX + statusWidth - 10, bubbleY + 14);

      if (state.currentAction && state.currentAction.phase === "doing") {
        const action = state.currentAction;
        const pct = clamp(action.elapsed / action.duration, 0, 1);
        fillRounded(x - 42, y - 42, 84, 6, 3, "rgba(8, 16, 26, 0.8)");
        fillRounded(x - 42, y - 42, 84 * pct, 6, 3, "#74d2bd");
      }
    }

    function draw() {
      drawRooms();
      drawObjects();
      drawCharacter();
    }

    function getObjectAt(x, y) {
      for (let i = OBJECTS.length - 1; i >= 0; i--) {
        const obj = OBJECTS[i];

        if (x >= obj.x && x <= obj.x + obj.w && y >= obj.y && y <= obj.y + obj.h) {
          return obj;
        }
      }

      return null;
    }

    function selectObject(obj) {
      state.selectedObject = obj.id;
      renderPanel();
    }

    function saveGame() {
      localStorage.setItem("miniLifeSimSave", JSON.stringify(state));
      notify("Game saved.");
    }

    function loadGame() {
      const raw = localStorage.getItem("miniLifeSimSave");

      if (!raw) {
        notify("No save found.");
        return;
      }

      try {
        const data = JSON.parse(raw);
        const base = createInitialState();

        state = {
          ...base,
          ...data,
          needs: { ...base.needs, ...(data.needs || {}) },
          char: { ...base.char, ...(data.char || {}) },
          warnings: { ...base.warnings, ...(data.warnings || {}) }
        };

        state.currentAction = null;
        state.moveTarget = null;

        renderPanel();
        renderNotifications();
        notify("Game loaded.");
      } catch (err) {
        notify("Save could not be loaded.");
      }
    }

    function resetGame() {
      localStorage.removeItem("miniLifeSimSave");
      state = createInitialState();
      renderPanel();
      renderNotifications();
      notify("New game started.");
    }

    canvas.addEventListener("click", (e) => {
      const rect = canvas.getBoundingClientRect();

      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;

      const x = (e.clientX - rect.left) * scaleX;
      const y = (e.clientY - rect.top) * scaleY;

      const obj = getObjectAt(x, y);

      if (obj) {
        selectObject(obj);
      } else {
        state.currentAction = null;
        state.moveTarget = { x, y };
        renderPanel();
      }
    });

    document.getElementById("pauseBtn").onclick = () => {
      state.paused = !state.paused;
      updateHUD();
    };

    document.querySelectorAll(".speed").forEach((btn) => {
      btn.onclick = () => {
        state.speed = Number(btn.dataset.speed);
        state.paused = false;
        updateHUD();
      };
    });

    document.getElementById("autonomy").onchange = (e) => {
      state.autonomy = e.target.checked;
      notify(`Autonomy ${state.autonomy ? "enabled" : "disabled"}.`);
    };

    document.getElementById("saveBtn").onclick = saveGame;
    document.getElementById("loadBtn").onclick = loadGame;
    document.getElementById("resetBtn").onclick = resetGame;

    window.addEventListener("keydown", (e) => {
      if (e.code === "Space") {
        e.preventDefault();
        state.paused = !state.paused;
        updateHUD();
      }

      if (e.key === "1") {
        state.speed = 1;
        state.paused = false;
        updateHUD();
      }

      if (e.key === "2") {
        state.speed = 5;
        state.paused = false;
        updateHUD();
      }

      if (e.key === "3") {
        state.speed = 15;
        state.paused = false;
        updateHUD();
      }

      if (e.key === "4") {
        state.speed = 60;
        state.paused = false;
        updateHUD();
      }
    });

    buildNeedsUI();
    renderPanel();
    renderNotifications();
    notify("Welcome! Click objects to interact.");

    let last = performance.now();

    function loop(now) {
      const dt = Math.min((now - last) / 1000, 0.1);
      last = now;

      if (!state.paused) {
        update(dt);
      }

      draw();
      requestAnimationFrame(loop);
    }

    requestAnimationFrame(loop);
  </script>
</body>
</html>
